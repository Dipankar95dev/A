<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    overflow:hidden;
}

/* Background Circles */
body::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#ff4ecd;
    border-radius:50%;
    top:-100px;
    left:-100px;
    filter:blur(50px);
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#00f2fe;
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(50px);
}

/* Glass Card */
.container{
    width:380px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
    color:#fff;
}

.container h2{
    text-align:center;
    margin-bottom:25px;
    font-size:28px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:12px 15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.18);
    color:#fff;
    font-size:15px;
}

.input-box input::placeholder,
.input-box textarea::placeholder{
    color:#e5e5e5;
}

.input-box select option{
    color:#000;
}

textarea{
    resize:none;
}

.gender{
    display:flex;
    gap:15px;
    margin-bottom:18px;
}

.gender label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
}

.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#ffffff;
    color:#2575fc;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    background:#00f2fe;
    color:#fff;
    box-shadow:0 0 20px rgba(0,242,254,.8);
}

.login{
    text-align:center;
    margin-top:18px;
}

.login a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.login a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="container">

<h2>✨ Register</h2>

<form>

<div class="input-box">
<input type="text" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="password" placeholder="Password" required>
</div>

<div class="gender">
<label><input type="radio" name="gender"> Male</label>
<label><input type="radio" name="gender"> Female</label>
</div>

<div class="input-box">
<input type="tel" placeholder="Mobile Number">
</div>

<div class="input-box">
<select>
<option>Select Country</option>
<option>India</option>
<option>Nepal</option>
<option>Bangladesh</option>
<option>Pakistan</option>
</select>
</div>

<div class="input-box">
<textarea rows="3" placeholder="Your Address"></textarea>
</div>

<button class="btn">Create Account</button>

<div class="login">
Already have an account?
<a href="#">Login</a>
</div>

</form>

</div>

</body>
</html>
