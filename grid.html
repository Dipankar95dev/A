<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .main {
            display: flex;
            width: 400px;
            height: 400px;
            justify-content: center;
            align-items: center;
            background-color: aqua;
            border: 2px solid ;
        }


        .div1{
            display: flex;
            background-color: rgb(69, 108, 108);
            width: 200px;
            height: 400px;
            border: 2px solid ;
        }
        .div2{
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 400px;
            background-color: blue;
            border: 2px solid white;
        }

        .child1{
            background-color: chartreuse;
            width: 100px;
            height: 400px;
            display: flex;  
            justify-content: center;
            align-items: center;
            border-right: 2px solid white;
        }

        .child2{
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            width: 100px;
            height: 400px;

        }


        .ch1{
            width: 200px;
            height: 200px;
            background-color: darkgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border-bottom: 2px solid white;
        }

        

        .ch2{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: brown;
            color: white;
            width: 200px;
            height: 200px;
        }

    </style>

</head>

<body>
    <div class="body">

        <div class="main">
            <div class="div1">
                <div class="child1">
                    Hello
                </div>
                <div class="child2">
                    hi
                </div>
            </div>
            <div class="div2">
                <div class="ch1">
                    hi
                </div>
                <div class="ch2">
                    hello
                </div>
            </div>

        </div>
    </div>
</body>

</html>
