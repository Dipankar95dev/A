<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .mein {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid;
            background-color: darkgreen;
            width: 400px;
            height: 400px;
        }

        .border {
            display: flex;
            background-color: darkgoldenrod;
            width: 200px;
            height: 400px;
            border: 2px solid rgb(17, 110, 216);
        }

        .border-1 {
            display: flex;
            width: 100px;
            height: 400px;
            justify-content: center;
            
            background-color: aquamarine;
            align-items: center;
        }

        .border-2 {
            display: flex;
            width: 100px;
            height: 400px;
            justify-content: center;
            align-items: center;
            background-color: chartreuse;
        }

        .room {
            display: flex;
            flex-direction: column;
            height: 400px;
            width: 200px;
            background-color: fuchsia;
            border: 2px solid rgb(114, 67, 214);
        }

        .room-1 {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: greenyellow;
            width: 200px;
            height: 200px;

        }

        .room-2 {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            color: antiquewhite;
            background-color: blueviolet;
        }
    </style>
</head>

<body>
    <div class="body">
        <div class="mein">

            <div class="border">
                <div class="border-1">
                    Hello
                </div>
                <div class="border-2">
                    friend
                </div>

            </div>

            <div class="room">
                <div class="room-1">
                    Dipankar
                </div>
                <div class="room-2">
                    Das
                </div>
            </div>


        </div>
    </div>

</body>

</html>
